name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stock-compatibility:
    name: Stock DSH 0.1.2-rc.1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24

      - name: Build, verify, and pack the plugin
        run: pnpm pack --out artifacts/stock-plugin.tgz

      - name: Install the published DSH release with a fixed dependency snapshot
        run: >-
          npm install --prefix artifacts/stock-dsh
          --registry https://registry.npmjs.org/
          --before 2026-09-04T00:00:00.000Z
          --ignore-scripts --no-audit --no-fund
          @deepseek-ai/dsh@0.1.2-rc.1

      - name: Install tarball into isolated DSH and verify startup, routes, and boot manifest
        run: >-
          node scripts/smoke-stock-compat.mjs
          --tarball artifacts/stock-plugin.tgz
          --dsh-entry artifacts/stock-dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
          --artifacts artifacts/stock-smoke-evidence

      - name: Preserve stock installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-dsh-${{ matrix.os }}
          path: artifacts/stock-smoke-evidence
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dsh_test_password
          POSTGRES_DB: dsh_team_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dsh_team_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24

      - name: Run unit tests
        run: pnpm test

      - name: Run real PostgreSQL concurrency test
        run: pnpm run test:postgres
        env:
          DSH_TEAM_POSTGRES_TEST_URL: postgres://postgres:dsh_test_password@127.0.0.1:5432/dsh_team_test

      - name: Build package
        run: pnpm run build

      - name: Verify package contents
        run: pnpm run verify:package

      - name: Initialize self-hosted smoke secrets
        run: node deploy/self-hosted/init-secrets.mjs

      - name: Build and start the self-hosted stack
        run: docker compose -f deploy/self-hosted/compose.yml up --build --wait --wait-timeout 240

      - name: Prove multi-Team invites, member keys, and data isolation
        run: >-
          docker compose -f deploy/self-hosted/compose.yml exec -T team-host
          node /opt/dsh/deploy/host/smoke-multi-team.mjs --confirm-test-data

      - name: Stop the self-hosted stack
        if: always()
        run: >-
          DSH_TEAM_POSTGRES_ENV_FILE=/dev/null
          DSH_TEAM_MIGRATION_ENV_FILE=/dev/null
          DSH_TEAM_HOST_ENV_FILE=/dev/null
          DSH_TEAM_BROKER_ENV_FILE=/dev/null
          docker compose -f deploy/self-hosted/compose.yml down --volumes --remove-orphans
