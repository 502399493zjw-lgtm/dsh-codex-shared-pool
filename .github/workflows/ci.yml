name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24

      - name: Run unit tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      - name: Verify package contents
        run: pnpm run verify:package

      - name: Pack publishable tarball
        run: pnpm pack --pack-destination "${RUNNER_TEMP}"
