- id: codex-shared-pool
  name: dsh-codex-shared-pool
  config:
    team:
      enabled: true
      storage: postgres
      databaseUrlRef: DSH_CODEX_SHARED_POOL_DATABASE_URL
      inviteTokenMasterKeyRef: DSH_CODEX_SHARED_POOL_INVITE_MASTER_KEY
