name: dsh-codex-shared-pool

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${DSH_TEAM_POSTGRES_ENV_FILE:-./.secrets/postgres.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init-runtime-logins.sh:/docker-entrypoint-initdb.d/10-runtime-logins.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  team-migrations:
    image: dsh-codex-shared-pool-team-host:local
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile
    restart: "no"
    init: true
    env_file:
      - ${DSH_TEAM_MIGRATION_ENV_FILE:-./.secrets/team-migrations.env}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - node
      - /opt/dsh-home/profiles/web/node_modules/dsh-codex-shared-pool/lib/team-migrate-bin.js
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  team-host:
    image: dsh-codex-shared-pool-team-host:local
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${DSH_TEAM_HOST_ENV_FILE:-./.secrets/team-host.env}
    depends_on:
      team-migrations:
        condition: service_completed_successfully
    ports:
      - ${DSH_TEAM_BIND_ADDRESS:-127.0.0.1}:${DSH_TEAM_PORT:-3080}:3080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3081/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  credential-broker:
    build:
      context: ../..
      dockerfile: deploy/broker/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: service:team-host
    env_file:
      - ${DSH_TEAM_BROKER_ENV_FILE:-./.secrets/credential-broker.env}
    depends_on:
      postgres:
        condition: service_healthy
      team-migrations:
        condition: service_completed_successfully
      team-host:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  team-edge:
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: service:team-host
    depends_on:
      team-host:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
